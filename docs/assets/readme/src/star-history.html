<!doctype html><html><head><meta charset="utf-8"><title>Context Mode README star-history 1280x640</title>
<script>var T=new URLSearchParams(location.search).get('theme')||'dark';document.documentElement.className=T;</script>
<link rel="stylesheet" href="cm.css">
<script src="star-data.js"></script>
<style>:root{--w:1280px;--h:640px}.h2{position:absolute;left:64px;top:84px;font-size:40px}.tl{font-family:var(--mono);font-size:11px;fill:var(--muted)}</style></head><body>
<main class="art" id="art"><div class="dots"></div>
<div class="abs eyebrow" style="left:64px;top:52px">GitHub stars, mksglu/context-mode</div>
<div class="h h2"><span id="hs"></span> stars <em id="hsince"></em></div>
<svg id="sv" class="abs" style="left:64px;top:160px" width="1152" height="380"></svg>
<div class="cap">Cumulative stars per day, from the GitHub stargazers API (starred_at), read <span id="hread"></span>; last point is the total on that day. Hacker News front page on 2026-02-28.</div>
</main>
<script>
document.getElementById("hs").textContent=STARS.toLocaleString("en-US");document.getElementById("hsince").textContent="since "+D[0][0]+".";document.getElementById("hread").textContent=READ_AT;
var W=1152,H=380,L=60,B=30,max=Math.ceil(STARS/5000)*5000;
function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);sv.appendChild(e);return e}
var t0=Date.parse(D[0][0]),t1=Date.parse(D[D.length-1][0]);
function X(d){return L+(W-L-10)*(Date.parse(d)-t0)/(t1-t0)}function Y(v){return H-B-(H-B-10)*v/max}
for(var v=0;v<=max;v+=5000){el("line",{x1:L,x2:W-10,y1:Y(v),y2:Y(v),stroke:"var(--card-b)","stroke-dasharray":"3 4"});var tx=el("text",{x:L-10,y:Y(v)+4,"text-anchor":"end",class:"tl"});tx.textContent=v.toLocaleString("en-US")}
var ticks=[];for(var m=new Date(D[0][0]);m<=new Date(READ_AT);m=new Date(Date.UTC(m.getUTCFullYear(),m.getUTCMonth()+2,1)))if(m>new Date(D[0][0]))ticks.push(m.toISOString().slice(0,10));
ticks.forEach(function(d){var tx=el("text",{x:X(d),y:H-8,"text-anchor":"middle",class:"tl"});tx.textContent=d.slice(0,7)});
var p=D.map(function(d,i){return (i?"L":"M")+X(d[0]).toFixed(1)+" "+Y(d[1]).toFixed(1)}).join(" ");
el("path",{d:p+" L"+X(D[D.length-1][0])+" "+Y(0)+" L"+X(D[0][0])+" "+Y(0)+" Z",fill:"var(--accent)",opacity:"0.12"});
el("path",{d:p,fill:"none",stroke:"var(--accent)","stroke-width":"3"});
</script></body></html>
