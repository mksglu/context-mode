# TEMPORARY [D5PROBE] workflow, removed after the run (D-D5-SAMPLES-1). Push-triggered by its own path only.
name: d5-probe
on:
  push:
    branches: [v2-design]
    paths: [".github/probe/**", ".github/workflows/d5-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    name: probe (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: ["24.15.0", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/ci-install.mjs
      - run: node build/build.mjs --generated-only
      - name: probe beside the full suite looping (default concurrency)
        shell: bash
        run: |
          ( while [ ! -f stop.flag ]; do node --test "tests/v2/**/*.test.mjs" > /dev/null 2>&1; done ) &
          LOOP=$!
          node .github/probe/d5-probe.mjs 60 load
          touch stop.flag; pkill -P $LOOP 2>/dev/null || true; kill $LOOP 2>/dev/null || true
