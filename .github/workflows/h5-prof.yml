name: h5-prof
on:
  push:
    branches: [v2-design]
    paths: [".h5-prof/**", ".github/workflows/h5-prof.yml"]
jobs:
  hosts:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.15.0" }
      - run: npm install --no-package-lock
      - run: node build/build.mjs --generated-only
      - run: node .h5-prof/annot.mjs "|FAIL|" node e2e/checks/windows-hosts.mjs
