# readme-stats (D-README-STATS-1). Keeps the README counts and the star chart current. No API key: GITHUB_TOKEN only.
# Scheduled jobs run only on the default branch (main), so this job goes live after the merge of v2-design to main.
# Until then, run it by hand with workflow_dispatch on main, or run `node build/readme-stats.mjs` locally.
name: readme-stats
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  readme-stats:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: read stars, stargazer dates and npm downloads; write stats.json and star-data.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node build/readme-stats.mjs
      - name: install Playwright (outside the repo)
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          npm install --prefix "$RUNNER_TEMP/pw" playwright
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: render the star chart
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw/node_modules
        run: node docs/assets/readme/src/render.mjs star-history
      - name: commit only if a file changed
        run: |
          if git diff --quiet -- stats.json docs/assets/readme; then
            echo "No change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add stats.json docs/assets/readme
            git commit -m "docs(readme): update stats and star chart"
            git push
          fi
