# Must live on the default branch: GitHub runs `issues` workflows only from there.
# D-INTAKE-SCORE-1: scores the report, sets "repro-ready" or "needs-info", keeps one comment up to date.
# D-INTAKE-LABELS-1: also sets the type labels (bug; enhancement + priority: low) and "duplicate" for a
# second open issue with the same setup report fingerprint.
# Issue state stays with maintainers.
name: issue-intake
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - name: Score body and act
        env:
          BODY: ${{ github.event.issue.body }}
          TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/issue-intake.mjs > "$RUNNER_TEMP/result.json"
          cat "$RUNNER_TEMP/result.json"
          node .github/scripts/issue-intake-act.mjs "$RUNNER_TEMP/result.json"
