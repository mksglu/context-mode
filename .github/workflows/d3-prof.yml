name: d3-prof
on:
  push:
    branches: [v2-design]
    paths: [".d3-prof/**", ".github/workflows/d3-prof.yml"]
jobs:
  prof:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        node: ["24.15.0", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-package-lock
      - run: node build/build.mjs --generated-only
      - run: node build/build.mjs --out release-out
      - run: node .d3-prof/prof4.mjs
