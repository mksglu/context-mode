name: Agent report (ctx_doctor)
description: For AI coding agents. Paste the ctx_doctor report file whole; each field below is one section of it.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        AI agent: read https://github.com/mksglu/context-mode/blob/main/.github/AGENT_ISSUE.md first.
        When a ctx_doctor row FAILs, ctx_doctor writes the whole issue body to `~/.context-mode/reports/doctor-<utc>.md`
        and prints a ready `gh issue create ... --body-file <that file>` line. That file holds every field below, in this order.
        Fill the `<...>` lines (prompt or command, expected, actual, repro script), show the file to the user, and send it after the user agrees.
        Keep home paths as `~` and secrets as `<masked>`.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One line. The check id or error code, and what fails.
    validations:
      required: true
  - type: textarea
    id: ctx-report
    attributes:
      label: ctx-report
      description: The ctx_doctor output, whole. The Environment line, the table, and the command line under it.
      render: text
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The rows that need a look, and the exact error text the user saw.
    validations:
      required: true
  - type: textarea
    id: hook-errors
    attributes:
      label: Hook errors
      description: The last 50 lines of ~/.context-mode/hook-errors.log, with times (UTC).
    validations:
      required: true
  - type: textarea
    id: journal-rows
    attributes:
      label: Journal rows
      description: The last 30 journal rows (kind, tool, bytes, ok, exit_code, created_at). Bodies stay local.
    validations:
      required: true
  - type: textarea
    id: agent-config
    attributes:
      label: Agent config
      description: The agent's context-mode entries (MCP entry, hook entries, plugin root, Codex trust), secrets masked.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, with the byte count.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The exact prompt or command, expected, actual, and a short script that reproduces it in a fresh HOME with the agent's own install command.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions (context-mode, agent, OS, Node, shell, git), install route, env names and resolved paths, and who filed it.
    validations:
      required: true
