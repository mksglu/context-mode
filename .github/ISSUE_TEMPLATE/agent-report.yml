name: Agent report (ctx_doctor)
description: For AI coding agents. Paste the ctx_doctor report file whole; each field below is one section of it.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        AI agent: follow these rules in order. The full guide with a filled example: https://github.com/mksglu/context-mode/blob/main/.github/AGENT_ISSUE.md

        1. Search for the same problem first: `gh issue list -R mksglu/context-mode --state all --search "<check id or error>"`. When one matches, add your facts there as a comment.
        2. File one bug per issue.
        3. Call the `ctx_doctor` tool and paste its full output unchanged in the `ctx-report` field.
        4. Give the versions: context-mode, the agent, the OS and arch, and Node.
        5. Write numbered repro steps that start from a fresh project (`mktemp -d`) and the agent's own install command.
        6. Give the exact command and its exact output in a fenced code block.
        7. Say what you expected and what happened instead.
        8. Name the source file and line when you found the cause.
        9. Replace every secret with `<masked>` and the home folder with `~` before you send.

        Fast path: when a ctx_doctor row FAILs, ctx_doctor writes the whole issue body to `~/.context-mode/reports/doctor-<utc>.md`
        and prints a ready `gh issue create ... --body-file <that file>` line. That file holds every field below, in this order.
        Fill the `<...>` lines, show the file to the user, and send it after the user agrees.
        A GitHub Action labels each issue `repro-ready` or `needs-info` and keeps one checklist comment up to date.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One line. The check id or error code, and what fails.
    validations:
      required: true
  - type: textarea
    id: ctx-report
    attributes:
      label: ctx-report
      description: The full ctx_doctor output, unchanged. The Environment lines, every row, and the lines under the table.
      render: text
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What happened instead, with the exact command and its exact output in a fenced block, and the source file and line when you found the cause.
    validations:
      required: true
  - type: textarea
    id: hook-errors
    attributes:
      label: Hook errors
      description: The last 50 lines of ~/.context-mode/hook-errors.log, with times (UTC).
    validations:
      required: true
  - type: textarea
    id: journal-rows
    attributes:
      label: Journal rows
      description: The last 30 journal rows (kind, tool, bytes, ok, exit_code, created_at). Bodies stay local.
    validations:
      required: true
  - type: textarea
    id: agent-config
    attributes:
      label: Agent config
      description: The agent's context-mode entries (MCP entry, hook entries, plugin root, Codex trust), secrets masked.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen, with the byte count.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: Numbered steps from a fresh project (mktemp -d) with the agent's own install command, then the exact prompt or command, and the actual result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Versions (context-mode, agent, OS and arch, Node, shell, git), install route, env names and resolved paths, and who filed it.
    validations:
      required: true
